[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./frontend/"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
